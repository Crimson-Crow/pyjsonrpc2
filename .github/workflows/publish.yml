name: publish

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # The ancestry check needs history, not a shallow clone
          filter: blob:none
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Verify the tag matches the project version
        run: |
          project="$(uv version --short)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$project" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match [project].version ${project}"
            exit 1
          fi
          echo "publishing ${project}"

      - name: Verify the tag is on main
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag ${GITHUB_REF_NAME} is not reachable from main"
            exit 1
          fi

  test:
    needs: verify-tag
    # Needs to be manually called, because tests run on a different trigger
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyjsonrpc2
    permissions:
      id-token: write # Mints the OIDC token PyPI trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Write access to the repo never shares OIDC token access
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # PyPI infers a prerelease from the version; GitHub needs to be told.
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=""
          else
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease

[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "pyjsonrpc2"
version = "2.0.0"
description = "A flexible Python implementation of the JSON-RPC 2.0 protocol."
readme = "README.md"
keywords = [ "client", "json", "json-rpc", "jsonrpc", "rpc", "server" ]
license = "MIT"
license-files = [ "LICENSE.txt" ]
maintainers = [ { name = "Crimson-Crow", email = "github@crimsoncrow.dev" } ]
authors = [ { name = "Crimson-Crow", email = "github@crimsoncrow.dev" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [ "orjson>=3.9" ]
urls."Bug Reports" = "https://github.com/Crimson-Crow/pyjsonrpc2/issues"
urls.Homepage = "https://github.com/Crimson-Crow/pyjsonrpc2"
urls.Source = "https://github.com/Crimson-Crow/pyjsonrpc2"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "W191",
  "E111",
  "E114",
  "E117",
  "D206",
  "D300",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "COM812",
  "COM819",
  "ISC001",
  "ISC002",
  "E501",
  "CPY001",
  "PT009",
  "PT027",
  "ANN401",
]
per-file-ignores."benchmarks/*" = [ "INP001" ]
per-file-ignores."examples/*" = [ "ANN", "EM", "ERA001", "INP001", "T201", "TRY003" ]
pydocstyle.convention = "google"

[tool.pyrefly]
project-includes = [ "src", "tests", "benchmarks" ]
python-version = "3.11"
preset = "strict"
# `typing.override` is 3.12+, setUpClass in tests.
errors.missing-override-decorator = false

[tool.coverage]
run.branch = true
run.parallel = true
run.source_pkgs = [ "pyjsonrpc2" ]
report.fail_under = 100
report.show_missing = true
report.skip_covered = true
paths.source = [ "src/", "*/site-packages/" ]

[tool.tox]
requires = [ "tox>=4.53", "tox-uv" ]
env_list = [
  { prefix = "3.", start = 11 },
  "mindeps",
  "coverage",
]

[tool.tox.gh.python]
"3.11" = [ "3.11", "mindeps" ]
"3.12" = [ "3.12" ]
"3.13" = [ "3.13" ]
"3.14" = [ "3.14" ]

[tool.tox.env_run_base]
description = "run the test driver with {basepython}"
deps = [ "coverage" ]
set_env.COVERAGE_FILE = "{work_dir}/.coverage"
commands = [ [ "coverage", "run", "-m", "unittest", "discover" ] ]

[tool.tox.env.mindeps]
description = "run the test driver against the lowest declared dependency versions"
base_python = [ "3.11" ]
uv_resolution = "lowest-direct"
deps = []
commands = [ [ "python", "-m", "unittest", "discover" ] ]

[tool.tox.env.bench]
description = "run the benchmark suite"
deps = [ "pyperf" ]
# pyperf will not create the directory its `-o` argument points into.
commands_pre = [ [ "python", "-c", "import pathlib; pathlib.Path('.benchmarks').mkdir(exist_ok=True)" ] ]
commands = [ [ "python", "benchmarks/bench_server.py", { replace = "posargs", extend = true } ] ]

[tool.tox.env.bench-compare]
description = "compare two benchmark result files"
skip_install = true
deps = [ "pyperf" ]
commands = [ [ "python", "-m", "pyperf", "compare_to", { replace = "posargs", extend = true } ] ]

[tool.tox.env.prek]
description = "run pre-commit hooks"
skip_install = true
deps = [ "prek" ]
recreate_commands = [ [ "{env_python}", "-Im", "prek", "clean" ] ]
commands = [ [ "prek", "run", "--all-files" ] ]

[tool.tox.env.coverage]
description = "combine coverage data and create report"
skip_install = true
deps = [ "coverage" ]
depends = [ "3.*" ]
commands = [ [ "coverage", "combine" ], [ "coverage", "report" ] ]
parallel_show_output = true
